name: gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-validate:
    name: Kernel validate (synthetic instance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regression-test the validator itself
        run: node test/kernel-validate.test.mjs

      - name: Regression-test the preflight check
        run: node test/preflight.test.mjs

      - name: Regression-test the rule resolver
        run: node test/rule-resolver.test.mjs

      - name: Verify the workspace scope model
        run: node test/workspace-scope-model.test.mjs

      - name: Verify the task pattern registry
        run: node test/task-pattern-registry.test.mjs

      - name: Verify the instruction source registry
        run: node test/instruction-source-registry.test.mjs

      - name: Verify the task specification contract
        run: node test/task-specification.test.mjs

      - name: Verify the execution state model
        run: node test/execution-state.test.mjs

      - name: Verify the role and human control contract
        run: node test/role-and-human-control.test.mjs

      - name: Verify the bounded context manifest contract
        run: node test/context-manifest.test.mjs

      - name: Verify the evidence and handoff contract
        run: node test/evidence-and-handoff.test.mjs

      - name: Verify the field-evaluation contract
        run: node test/field-evaluation.test.mjs

      - name: Verify the workspace compatibility qualification contract
        run: node test/workspace-compatibility-qualification.test.mjs

      - name: Verify the upgrade integration qualification contract
        run: node test/upgrade-integration-qualification.test.mjs

      # --kernel-only keeps this voluntary run portable. The private
      # real-bundle proof remains available as a separate voluntary run.
      - name: Regression-test the conformance harness (kernel-only, no real-bundle proof)
        run: node test/conformance-harness.test.mjs --kernel-only

      - name: Regression-test the pre-push Git-environment isolation
        run: node test/pre-push-git-isolation.test.mjs

      - name: Regression-test the metrics-logging wrapper
        run: node test/validate-and-log.test.mjs

      - name: Regression-test the branch-name syntax check
        run: node test/branch-name-validation.test.mjs

      - name: Validate against the synthetic instance
        env:
          MERIDIAN_INSTANCE: ${{ github.workspace }}/test/instance-fixture
        run: node scripts/kernel-validate.mjs

      - name: State what this run did not verify
        if: always()
        run: |
          echo "::notice::CI ran against test/instance-fixture, a fictional product."
          echo "::notice::It proves the Kernel works against an Instance, and that personal-path leaks are absent."
          echo "::notice::It does NOT prove the real product's literals are absent: that check needs the private Instance and runs locally."
          echo "::notice::GitHub CI does NOT verify the frozen private Instance: the conformance harness ran --kernel-only, so the package 8 real-bundle migration proof is UNVERIFIED here."
          echo "::notice::This workflow is voluntary and does not gate acceptance, merge, release, or Concord onboarding."

  rust-workspace:
    name: Rust workspace validate (foundation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace
        run: cargo test --locked --workspace

      - name: Doc build
        run: cargo doc --locked --workspace --no-deps
