[package]
name = "meridian-app"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Meridian Rust application layer — ports and orchestration over meridian-core."

[lints]
workspace = true

[dependencies]
jsonschema = { version = "0.56.0", default-features = false }
meridian-core = { path = "../meridian-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde-saphyr = "1.3.0"
