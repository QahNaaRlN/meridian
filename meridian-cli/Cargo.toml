[package]
name = "meridian-cli"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Meridian Rust CLI — composition root binary. Carries no domain commands in this package."

[lints]
workspace = true

[[bin]]
name = "meridian"
path = "src/main.rs"

[dependencies]
meridian-app = { path = "../meridian-app" }
meridian-storage-sqlite = { path = "../meridian-storage-sqlite" }
