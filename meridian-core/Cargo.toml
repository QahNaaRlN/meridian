[package]
name = "meridian-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Meridian Rust domain core — synchronous, side-effect-free domain logic (no files, Git, DB, network, env, or output)."

[lints]
workspace = true

[dependencies]
# Pure pattern matching only (`task_contracts::portability`): no filesystem,
# Git, process, env or output I/O in this crate — see
# `standards/workspace/rust-migration-quality.md` §5's I/O boundary and
# `rust-architecture-conformance-3` corrective round item 2, which moved
# `non_portable_reason`/`resolve_schema_ref` here so
# `task_contracts::specification::check_task_specification` can gate its own
# `TaskSpecification` construction on portability itself, in the one public
# constructor, rather than depending on a caller running a second pass.
fancy-regex = "0.19.0"
sha2 = { version = "0.11.0", default-features = false }
# Rust's own `{:e}` (`LowerExp`) formatting does not implement ECMA-262
# `Number::toString`'s round-to-even tie-break rule and was PROVEN to diverge
# from it by differential testing against real `JSON.stringify` (minimal
# counterexample: -86666878403640.625, where Rust's formatter picks the odd
# digit "...63" and JS picks the even digit "...62" — see
# `meridian-core/src/json.rs` and `meridian-core/tests/`). `ryu` (the
# shortest-round-trip float formatter serde_json itself uses) was verified to
# produce the JS-matching digit choice for that counterexample and is used as
# the digit source instead; only the surrounding ECMA case-selection and
# punctuation logic is still hand-written.
ryu = { version = "1", default-features = false }
