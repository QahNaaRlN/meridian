$schema: ../../registries/operating-model/role-registry.schema.json
schema_version: 1
id: role-registry
title: Каталог универсальных ролей
record_type: role-registry
scope:
  type: built-in-methodology
  id: built-in-methodology
origin:
  kind: built-in
authority:
  kind: methodology-owner
  authority_ref: methodology-owner

# Семь универсальных инженерных ролей. Роль — набор полномочий и
# ответственности (operating-glossary.md: role), а не участник, программа,
# модель ИИ или поставщик. Один участник может совмещать несколько ролей;
# конкретные назначения запуска живут в записи run-human-control области
# run-state, а не здесь. Общий конверт каждой записи проверяется
# registries/operating-model/scoped-record.schema.json; тело каталога —
# registries/operating-model/role-registry.schema.json. Пул закрыт: добавление
# или удаление роли — изменение универсальной нормы Ядра.
payload:
  roles:
    - id: owner
      title: Владелец
      summary: Человек, командующий работой, задающий цель, границы полномочий и допустимый риск.
      responsibilities:
        - "Задаёт цель единицы работы, её границы и критерии приёмки."
        - "Определяет допустимый риск и объём разрешённой автономии."
        - "Принимает решения владельца там, где система не вправе выбирать сама."
        - "Сохраняет командование при любом режиме надзора и может вмешаться в любой момент."
    - id: operator
      title: Оператор
      summary: Участник, ведущий сеанс исполнения и передающий поручения и решения между владельцем и исполнителем.
      responsibilities:
        - "Ведёт сеанс работы над единицей работы и следит за состоянием запуска."
        - "Передаёт поручения, уточнения и решения владельца исполнителю."
        - "Поднимает владельцу вопросы, требующие решения, и препятствия."
        - "Не подменяет решение владельца собственным выбором."
    - id: executor
      title: Исполнитель
      summary: Участник, выполняющий назначенную единицу работы в границах предоставленных полномочий.
      responsibilities:
        - "Выполняет назначенную единицу работы и только её."
        - "Работает в границах разрешённой области и полномочий, не расширяя их сам."
        - "Готовит проверяемый результат, изменения и передачу состояния."
        - "Останавливается и сообщает о препятствии или необходимости решения владельца."
    - id: reviewer
      title: Проверяющий
      summary: Участник, независимо оценивающий предложенный результат до его приёмки.
      responsibilities:
        - "Читает фактический результат и изменения, а не только отчёт о них."
        - "Выносит единый вердикт: доработать или принять."
        - "Проверяет соответствие применимым нормам, протоколам и критериям приёмки."
        - "Остаётся отдельным от участника, чей результат он независимо проверяет, когда независимость назначена."
    - id: verifier
      title: Проверяющий результаты
      summary: Участник, выполняющий проверочные прогоны и подтверждающий доказательства результата.
      responsibilities:
        - "Выполняет проверочные прогоны и проверочные рубежи."
        - "Подтверждает, что заявленные доказательства воспроизводимы."
        - "Отмечает пройденные, непройденные и невыполнимые проверки раздельно."
        - "Не повышает статус результата без предусмотренного контрактом доказательства."
    - id: git_integrator
      title: Интегратор Git
      summary: Участник, готовящий и проверяющий интеграцию и выполняющий назначенные действующим потоком Git-операции.
      responsibilities:
        - "Готовит интеграцию: ветви, индексацию, коммиты и теги, и проверяет её результат."
        - "Выполняет только те Git-операции, которые назначены действующим потоком контроля версий."
        - "Проводит послесливную сверку фактической истории и повторный прогон проверочных рубежей."
        - "Не присваивает себе окончательное слияние: принятый порядок может передать его владельцу."
        - "Действует после независимого ревью, а не по одному отчёту исполнителя."
    - id: deployer
      title: Ответственный за развёртывание
      summary: Участник, проводящий развёртывание принятого результата и последующее наблюдение.
      responsibilities:
        - "Проводит развёртывание принятого и интегрированного результата."
        - "Ведёт наблюдение в объявленном окне и фиксирует отклонения."
        - "Инициирует откат или срочное исправление при отклонении развёрнутого состояния."
        - "Не начинает развёртывание непринятого или неинтегрированного результата."
