$schema: ../../registries/operating-model/task-pattern-registry.schema.json
schema_version: 1
registry_id: task-pattern-registry
title: Каталог типов задач

# Семь универсальных шаблонов типов задач, по одному на каждую действующую
# классификационную пару набора work_kind / change_class
# (standards/workspace/rule-resolution.md §2–§3). Общий конверт каждой записи
# проверяется registries/operating-model/scoped-record.schema.json; тело шаблона
# в payload — registries/operating-model/task-pattern-registry.schema.json.
#
# Протокол, способ выполнения и контракт доказательств — разные сущности
# глоссария и лежат в разных осях: applicable_protocols, applicable_skills,
# applicable_evidence_contracts. Способ выполнения (skills/<имя>/SKILL.md) не
# помещается в массив протоколов, и наоборот. Отсутствие канонического
# источника записано явной ссылкой status: absent с причиной, а не
# правдоподобной догадкой.

task_patterns:
  - $schema: ../../registries/operating-model/scoped-record.schema.json
    schema_version: 1
    id: assess-existing-state
    title: Оценка существующего состояния
    record_type: task-pattern
    scope:
      type: built-in-methodology
      id: built-in-methodology
    origin:
      kind: built-in
    authority:
      kind: methodology-owner
      authority_ref: methodology-owner
    payload:
      work_kind: assessment
      invariants:
        - "Состояние системы не изменяется — оценка только наблюдает и выносит суждение."
        - "Проверенный факт, вывод и неразрешённое препятствие помечаются раздельно."
        - "Неполнота оценки обозначается явным состоянием UNVERIFIED, а не правдоподобной догадкой."
      required_inputs:
        - "Предмет оценки и вопрос, на который она отвечает."
        - "Действующий контракт или критерии, относительно которых выносится суждение."
        - "Границы области — какие репозитории, пути и аспекты входят в оценку."
      required_evidence:
        - "Наблюдения, на которых основано суждение, с указанием источника каждого."
        - "Явный перечень непроверенного и препятствий."
        - "Итоговое суждение с обоснованием и его границами."
      stop_conditions:
        - "Запрошено изменение состояния системы — это уже отдельная единица работы, а не оценка."
        - "Предмет или критерии оценки неоднозначны и требуют решения владельца."
        - "Требуемое наблюдение недоступно, и суждение осталось бы бездоказательным."
      applicable_protocols:
        - status: present
          id: standard-task-lifecycle
          path: workflows/task-lifecycle.md
      applicable_skills:
        - status: absent
          absence_reason: "Отдельный завендоренный способ выполнения оценки в Ядре отсутствует; практика оценки следует этапам UNDERSTAND и REPORT жизненного цикла задачи."
      applicable_evidence_contracts:
        - status: absent
          absence_reason: "Канонический контракт доказательств оценки в Ядре не определён — форма записи суждения закрепляется отдельным пакетом операционной модернизации; до него доказательства оценки подчиняются требованиям этапа REPORT жизненного цикла задачи."

  - $schema: ../../registries/operating-model/scoped-record.schema.json
    schema_version: 1
    id: operate-environment-action
    title: Эксплуатационное действие в среде
    record_type: task-pattern
    scope:
      type: built-in-methodology
      id: built-in-methodology
    origin:
      kind: built-in
    authority:
      kind: methodology-owner
      authority_ref: methodology-owner
    payload:
      work_kind: operation
      invariants:
        - "Эффект действия ограничен эксплуатационной средой и не изменяет исходный код или конфигурацию репозитория как единицу поставки."
        - "Действие выполняется только в заранее объявленных владельцем границах среды, доступа и допустимого риска."
        - "При сопоставимом результате выбирается обратимое действие; необратимое требует явного полномочия и доказательства цели."
      required_inputs:
        - "Цель эксплуатационного действия и наблюдаемый результат, который его подтверждает."
        - "Целевая среда, требуемый доступ и допустимые побочные эффекты."
        - "Полномочие владельца на выполнение действия с указанными эффектами."
      required_evidence:
        - "Предусловие среды, зафиксированное до действия."
        - "Факт выполнения действия и наблюдаемый результат после него."
        - "Подтверждение, что эффект остался в объявленных границах."
      stop_conditions:
        - "Требуемый доступ, среда или полномочие отсутствуют."
        - "Действие затрагивает исходный код репозитория — требуется единица работы вида change."
        - "Наблюдаемый результат расходится с ожидаемым, и продолжение увеличивает необратимый эффект."
      applicable_protocols:
        - status: present
          id: standard-task-lifecycle
          path: workflows/task-lifecycle.md
      applicable_skills:
        - status: absent
          absence_reason: "Отдельный завендоренный способ выполнения эксплуатационного действия в Ядре отсутствует; практика определяется локальными правилами и средствами репозитория."
      applicable_evidence_contracts:
        - status: absent
          absence_reason: "Канонический контракт доказательств эксплуатационного действия в Ядре пока не определён; наблюдение поведения работающего приложения подчиняется отдельному smoke-протоколу только когда действие является дымовой проверкой."

  - $schema: ../../registries/operating-model/scoped-record.schema.json
    schema_version: 1
    id: decompose-initiative
    title: Декомпозиция инициативы
    record_type: task-pattern
    scope:
      type: built-in-methodology
      id: built-in-methodology
    origin:
      kind: built-in
    authority:
      kind: methodology-owner
      authority_ref: methodology-owner
    payload:
      work_kind: initiative
      decomposition_required: true
      invariants:
        - "Инициатива не принимается и не разрешается как единая неделимая единица работы — до декомпозиции обязателен явный список дочерних единиц."
        - "Инициатива не маркируется одним классом изменения; каждая дочерняя единица получает собственный вид работы и, если это change, собственный класс изменения."
        - "Разнородные части — перенос без изменения поведения, намеренное изменение поведения, оценка — разделяются, а не объединяются под один класс."
      required_inputs:
        - "Крупная цель и причина, по которой она не выполняется как одна единица работы."
        - "Полный перечень затрагиваемых репозиториев, областей и ограничений."
        - "Критерий готовности декомпозиции — когда список дочерних единиц считается полным."
      required_evidence:
        - "Явный список дочерних единиц работы с видом работы и классом изменения каждой."
        - "Отображение каждой части исходной цели на дочернюю единицу без пропусков и пересечений."
        - "Перечень того, чего не хватает для перехода к декомпозиции, пока список неполон."
      stop_conditions:
        - "Полный список репозиториев-источников или ограничений не предоставлен — декомпозиция не может быть завершена."
        - "Часть цели не относится однозначно ни к одной дочерней единице."
        - "Предпринята попытка исполнить инициативу целиком без выделения дочерних единиц."
      applicable_protocols:
        - status: present
          id: standard-task-lifecycle
          path: workflows/task-lifecycle.md
        - status: absent
          absence_reason: "Отдельный канонический протокол декомпозиции инициативы в Ядре ещё не объявлен (rule-resolution.md §6 допускает его отсутствие); до него применяются этап UNDERSTAND жизненного цикла задачи и правило §6 разрешения норм."
      applicable_skills:
        - status: absent
          absence_reason: "Отдельный завендоренный способ выполнения декомпозиции в Ядре отсутствует; порядок задаётся этапом UNDERSTAND жизненного цикла задачи."
      applicable_evidence_contracts:
        - status: absent
          absence_reason: "Инициатива не производит единого доказательства — доказательства принадлежат дочерним единицам работы согласно их классам; канонический контракт доказательств самой декомпозиции в Ядре не определён."

  - $schema: ../../registries/operating-model/scoped-record.schema.json
    schema_version: 1
    id: fix-defect
    title: Исправление дефекта
    record_type: task-pattern
    scope:
      type: built-in-methodology
      id: built-in-methodology
    origin:
      kind: built-in
    authority:
      kind: methodology-owner
      authority_ref: methodology-owner
    payload:
      work_kind: change
      change_class: BUGFIX
      invariants:
        - "Поведение существует и неправильно относительно уже действующего контракта; задача восстанавливает контракт, а не вводит новое поведение и не меняет его намеренно."
        - "Исправление оставляет после себя регрессионное утверждение, доказанно падавшее на дефектной реализации."
        - "Рефакторинг, переименования, форматирование и попутные улучшения в единицу работы не входят."
      required_inputs:
        - "Воспроизводимые входные условия, ожидаемое поведение, фактическое поведение и нарушенный доменный инвариант."
        - "Источник действующего контракта, относительно которого поведение признано неправильным."
        - "Минимальная граница исправления."
      required_evidence:
        - "Вывод раннера с падением поведенческого утверждения на дефектном коде — RED, а не ошибка окружения."
        - "Вывод раннера с прохождением того же утверждения после исправления — GREEN."
        - "Результат релевантного существующего набора проверок, требуемого локальными правилами репозитория."
      stop_conditions:
        - "Классификация неоднозначна — непонятно, BUGFIX это, FEATURE или BEHAVIOR_CHANGE."
        - "Существующее утверждение противоречит исправлению."
        - "Регрессионное утверждение технически невозможно получить как доказательство."
        - "Требования, реализация и тесты расходятся между собой, и починка одного слоя ответом не является."
      applicable_protocols:
        - status: absent
          absence_reason: "Отдельного документа-протокола класса protocol для BUGFIX в Ядре нет: обязательный порядок Reproduce → RED → Fix → GREEN → релевантный набор и его инварианты несут маршрут verification/regression-testing/README.md и способ выполнения skills/bugfix-protocol/SKILL.md; выделение такого документа — отдельное решение вне этого пакета."
      applicable_skills:
        - status: present
          id: bugfix-protocol
          path: skills/bugfix-protocol/SKILL.md
      applicable_evidence_contracts:
        - status: present
          id: regression-evidence-record
          path: verification/regression-testing/README.md

  - $schema: ../../registries/operating-model/scoped-record.schema.json
    schema_version: 1
    id: add-capability
    title: Добавление новой возможности
    record_type: task-pattern
    scope:
      type: built-in-methodology
      id: built-in-methodology
    origin:
      kind: built-in
    authority:
      kind: methodology-owner
      authority_ref: methodology-owner
    payload:
      work_kind: change
      change_class: FEATURE
      invariants:
        - "Поведения раньше не было — задача вводит новую наблюдаемую возможность, а не восстанавливает и не меняет существующий контракт."
        - "Приёмочные утверждения новой возможности определены до реализации и наблюдаются на минимальном достаточном слое."
        - "Изменение ограничено новой возможностью; существующее поведение не затрагивается без отдельной единицы работы."
      required_inputs:
        - "Описание новой возможности и наблюдаемый результат, который считается её наличием."
        - "Приёмочные критерии и слой, на котором проверяется каждый из них."
        - "Границы — какие существующие контракты не должны измениться."
      required_evidence:
        - "Приёмочные утверждения, выполняющиеся на реализованной возможности."
        - "Результат релевантного существующего набора проверок, подтверждающий отсутствие регресса."
        - "Явный перечень непроверенного и препятствий."
      stop_conditions:
        - "Ожидаемый контракт новой возможности существенно неоднозначен."
        - "Реализация вынуждает изменить существующее наблюдаемое поведение — требуется отдельная единица работы класса BEHAVIOR_CHANGE."
        - "Приёмочный критерий нельзя наблюдать ни на одном доступном слое."
      applicable_protocols:
        - status: present
          id: standard-task-lifecycle
          path: workflows/task-lifecycle.md
      applicable_skills:
        - status: absent
          absence_reason: "Отдельный завендоренный способ выполнения для новой возможности в Ядре отсутствует; практика задаётся постановкой задачи и локальными правилами репозитория."
      applicable_evidence_contracts:
        - status: absent
          absence_reason: "Канонический контракт доказательств для новой возможности в Ядре не определён — состав приёмочных утверждений задаётся постановкой задачи и локальными правилами репозитория; универсальная форма такого доказательства закрепляется отдельным пакетом."

  - $schema: ../../registries/operating-model/scoped-record.schema.json
    schema_version: 1
    id: change-behavior
    title: Намеренное изменение поведения
    record_type: task-pattern
    scope:
      type: built-in-methodology
      id: built-in-methodology
    origin:
      kind: built-in
    authority:
      kind: methodology-owner
      authority_ref: methodology-owner
    payload:
      work_kind: change
      change_class: BEHAVIOR_CHANGE
      invariants:
        - "Контракт меняется намеренно, и есть ссылка на решение, разрешившее это изменение."
        - "Изменение поведения не выдаётся за исправление дефекта и не выдаётся за рефакторинг."
        - "Все известные потребители изменяемого контракта названы, а затронутая документация приведена в соответствие в той же единице работы."
      required_inputs:
        - "Прежний контракт, новый контракт и явная ссылка на решение об изменении."
        - "Перечень известных потребителей изменяемого контракта."
        - "Приёмочные критерии нового поведения и переходные требования, если они есть."
      required_evidence:
        - "Утверждения, наблюдающие новое поведение согласно новому контракту."
        - "Подтверждение, что прежнее поведение больше не заявляется действующим — обновлённые контракт и документация."
        - "Результат релевантного существующего набора проверок для затронутых границ."
      stop_conditions:
        - "Ссылка на решение об изменении контракта отсутствует."
        - "Изменение на деле восстанавливает нарушенный контракт — это BUGFIX — либо не меняет наблюдаемое поведение — это REFACTOR."
        - "Потребитель изменяемого контракта не идентифицируется, и последствия изменения неизвестны."
      applicable_protocols:
        - status: present
          id: standard-task-lifecycle
          path: workflows/task-lifecycle.md
      applicable_skills:
        - status: absent
          absence_reason: "Отдельный завендоренный способ выполнения намеренного изменения поведения в Ядре отсутствует; практика задаётся постановкой задачи и локальными правилами репозитория."
      applicable_evidence_contracts:
        - status: absent
          absence_reason: "Канонический контракт доказательств намеренного изменения контракта в Ядре не определён — обязательны ссылка на решение и приведение затронутого контракта в соответствие; универсальная форма записи закрепляется отдельным пакетом."

  - $schema: ../../registries/operating-model/scoped-record.schema.json
    schema_version: 1
    id: refactor-preserving-behavior
    title: Рефакторинг с сохранением поведения
    record_type: task-pattern
    scope:
      type: built-in-methodology
      id: built-in-methodology
    origin:
      kind: built-in
    authority:
      kind: methodology-owner
      authority_ref: methodology-owner
    payload:
      work_kind: change
      change_class: REFACTOR
      invariants:
        - "Наблюдаемое поведение системы сохраняется — внешний контракт (публичный API, наблюдаемый ввод и вывод, побочные эффекты, видимое пользователю) до и после изменения идентичен."
        - "Изменяется только внутреннее устройство кода при неизменном контракте."
        - "Дефект, найденный в ходе рефакторинга, не исправляется молча — заводится отдельная единица работы BUGFIX либо запрашивается решение владельца; исходный класс REFACTOR не меняется."
        - "Расширение изменённых путей за пределы разрешённых требует повторного разрешения норм до проверки."
      required_inputs:
        - "Область изменения и затрагиваемые пути."
        - "Сохраняемый наблюдаемый контракт как утверждения по четырём граням — публичный API, наблюдаемый ввод и вывод, побочные эффекты и взаимодействия, видимое пользователю поведение."
        - "Критерии приёмки, опирающиеся на функциональный паритет."
      required_evidence:
        - "Базовое наблюдение поведения до изменения с закреплённым исходным состоянием и зафиксированными условиями."
        - "Наблюдение поведения после изменения на тех же либо явно сопоставимых условиях, привязанное к утверждениям сохраняемого контракта."
        - "Сравнение до и после и вердикт функционального паритета по каждому утверждению и в целом."
      stop_conditions:
        - "Обнаружено изменение наблюдаемого поведения — единица работы не является REFACTOR целиком."
        - "Базовое наблюдение не удалось установить — паритет остаётся UNVERIFIED."
        - "Изменённые пути вышли за пределы разрешения норм, и повторное разрешение не выполнено."
      applicable_protocols:
        - status: present
          id: refactor-execution-protocol
          path: verification/functional-parity/refactor-protocol.md
      applicable_skills:
        - status: absent
          absence_reason: "Отдельного завендоренного способа выполнения рефакторинга в Ядре нет; практический порядок исполнения несёт сам протокол функционального паритета (CLASSIFY → DEFINE PARITY → CAPTURE BASELINE → IMPLEMENT → CAPTURE POST-CHANGE → COMPARE → REPORT)."
      applicable_evidence_contracts:
        - status: present
          id: functional-parity-evidence-contract
          path: verification/functional-parity/functional-parity-evidence-contract.md
